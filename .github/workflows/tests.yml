name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the app and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the tests
        run: python -m pytest -q

  windows-launcher:
    name: run.bat first-run setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up through run.bat and show the app's help
        shell: cmd
        run: run.bat --help
      - name: A second run reuses the environment
        shell: cmd
        run: run.bat --help
