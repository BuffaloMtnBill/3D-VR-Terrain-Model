[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-map-extractor"
version = "1.0.0"
description = "An OpenStreetMap terrain selection and 3D modeling studio"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1.3,<4", "Werkzeug>=3.1.6,<4", "numpy>=2.1,<3", "scipy>=1.14,<2", "Pillow>=12.3,<13", "requests>=2.33,<3", "urllib3>=2.8,<3", "Shapely>=2.0,<3", "manifold3d>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
terrain-studio = "terrain_app.__main__:main"

[tool.setuptools.packages.find]
include = ["terrain_app*"]

[tool.setuptools.package-data]
terrain_app = ["templates/*", "static/*", "static/vendor/*", "static/vendor/images/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
